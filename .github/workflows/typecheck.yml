name: Verificar tipos
on: workflow_dispatch
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Os erros saem como anotações (ficheiro e linha), para se lerem sem os logs
      - run: |
          npx tsc --noEmit -p . --pretty false > tsc.txt || true
          cat tsc.txt
          awk -F'[(),]' '/error TS/ { msg=$0; sub(/^[^:]*: /, "", msg); printf "::error file=%s,line=%s::%s\n", $1, $2, msg }' tsc.txt
          ! grep -q "error TS" tsc.txt
